[project]
name = "democracy"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "ipykernel==6.29.5",
    "matplotlib==3.10.5",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "python-dotenv==1.0.1",
    "pyyaml==6.0.1",
    "scipy==1.16.0",
    "scons==4.8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["source"]
